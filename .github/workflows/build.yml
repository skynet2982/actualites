name: Build and Deploy
on:
  push:
    branches:
      - main
  schedule:
      - cron: "*/30 * * * *"
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
            persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore previous build state 📜
        run: |
          git fetch origin gh-pages --depth=1 || true
          mkdir -p dist
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            # Two separate calls: git archive aborts the whole archive (even
            # for paths that do exist) if any single pathspec doesn't match,
            # and history.json won't exist yet on the very first run.
            git archive origin/gh-pages -- articles 2>/dev/null | tar -x -C dist 2>/dev/null || true
            git archive origin/gh-pages -- history.json 2>/dev/null | tar -x -C dist 2>/dev/null || true
          fi
      - name: Install and Build
        run: |
          npm ci --omit=dev
          npm run build
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          folder: dist
